<style>
:root{--bg:#0d0b14;--fg:#ece8f5;--mut:#a39cb8;--acc:#7cff6b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;padding:16px;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.6;background-image:
  radial-gradient(1.5px 1.5px at 10% 20%,#fff,transparent),
  radial-gradient(1.5px 1.5px at 80% 15%,#fff,transparent),
  radial-gradient(1px 1px at 60% 45%,#fff,transparent),
  radial-gradient(1.5px 1.5px at 25% 65%,#fff,transparent),
  radial-gradient(1px 1px at 90% 70%,#fff,transparent),
  radial-gradient(1.5px 1.5px at 45% 85%,#fff,transparent),
  radial-gradient(1px 1px at 15% 90%,#fff,transparent),
  radial-gradient(1.5px 1.5px at 70% 30%,#fff,transparent);
  animation:twinkle 4s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.35}to{opacity:.75}}
main{max-width:420px;width:100%;text-align:center;position:relative}
.glyph{font-size:3rem;margin-bottom:4px;filter:drop-shadow(0 0 24px rgba(124,255,107,.45))}
h1{font-size:2rem;margin:0 0 4px}p{color:var(--mut);margin:0 0 24px}
a{display:block;padding:14px;margin:10px 0;border:1px solid #2c2640;border-radius:12px;color:var(--fg);text-decoration:none;font-weight:600;transition:border-color .15s,color .15s,transform .15s}
a:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
@media (prefers-reduced-motion: reduce){body::before{animation:none}}
