<style>
:root{
  --void:#0c0624;--nebula:#1e123c;--glow:#3a2266;--panel:#06061e;
  --ink:#f5f1fa;--ink-muted:#b8b0d4;--lavender:#c898f0;--lavender-soft:#9690cc;
  --gold:#e8c47a;--spark:#fcf6d2;
  --display:"Sora",system-ui,sans-serif;--sans:"Quicksand","Comfortaa",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:48px 16px;overflow-x:hidden;position:relative;
  background:radial-gradient(900px 600px at 85% 105%,var(--glow),transparent 60%),radial-gradient(700px 500px at 0% 0%,var(--nebula),transparent 70%),var(--void);
  color:var(--ink);font:500 16px/1.5 var(--sans)}
.sky{position:fixed;inset:0;pointer-events:none}
.sky i{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--spark);opacity:.7;animation:twinkle 5s ease-in-out infinite alternate}
.sky i:nth-child(2n){width:2px;height:2px;animation-delay:-2s}
.sky i:nth-child(3n){animation-delay:-3.5s}
.sky svg{position:absolute;fill:var(--gold)}
@keyframes twinkle{from{opacity:.25}to{opacity:.8}}
main{position:relative;max-width:420px;width:100%;text-align:center}
.avatar{width:128px;height:128px;border-radius:50%;border:3px solid var(--lavender-soft);box-shadow:0 0 24px rgba(200,152,240,.35);display:block;margin:0 auto 20px}
h1{font:700 2.5rem/1.05 var(--display);margin:0;letter-spacing:-.5px}
h1 span{color:var(--lavender)}
.tag{display:inline-block;margin:16px 0 12px;padding:4px 16px;border:1.5px solid var(--lavender-soft);border-radius:999px;font-weight:600;font-size:15px}
p{color:var(--ink-muted);margin:0 0 28px}
nav a{display:block;padding:14px 16px;margin:12px 0;background:var(--panel);border:1.5px solid var(--lavender-soft);border-radius:16px;color:var(--ink);text-decoration:none;font-weight:700;font-size:17px;transition:border-color .15s,color .15s,transform .15s}
nav a:hover{border-color:var(--lavender);color:var(--lavender);transform:translateY(-1px)}
nav a:focus-visible{outline:2px solid var(--lavender);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sky i{animation:none}nav a{transition:none}nav a:hover{transform:none}}
</style></head><body>
